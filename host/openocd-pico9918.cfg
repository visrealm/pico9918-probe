# First: python host/pico9918_probe.py --port COM8 arm manual
# Optional before this file: -c "adapter serial SERIAL_FROM_INFO_OR_PORTS"
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000
reset_config none
# Append -f target/rp2040.cfg for PICO9918, or -f target/rp2350.cfg for PRO.
# GP21 is the HOST reset input, not the target MCU's RUN/nSRST pin.
