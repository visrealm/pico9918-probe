<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<title>Optional transistor target power switch</title>
<rect x="0" y="0" width="1600" height="1120" fill="#ffffff" stroke="#ffffff"/>
<text x="45" y="54" fill="#17324d" font-family="Arial, sans-serif" font-size="31" font-weight="700">OPTIONAL TARGET POWER  /  PARTS ALREADY ON HAND</text>
<text x="45" y="85" fill="#667789" font-family="Arial, sans-serif" font-size="19" font-weight="400">BC327-40 + 2N3904 + four resistors  |  GP22 HIGH = power ON  |  LOW / floating = OFF</text>
<rect x="45" y="106" width="1510" height="55" fill="#fff2d8" stroke="#fff2d8"/>
<text x="60" y="131" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="700">Replace the page-1 power jumper with this switch. Leave target USB unplugged; retain all signal/ground wires.</text>
<text x="60" y="153" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="400">Q1 switches +5 V. Ground remains permanently connected. No target 3.3 V connection.</text>
<text x="95" y="232" fill="#17324d" font-family="Arial, sans-serif" font-size="22" font-weight="700">PICO 2 VBUS</text>
<text x="95" y="261" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">Physical pin 40</text>
<line x1="95" y1="285" x2="740" y2="285" stroke="#087c74" stroke-width="3"/>
<text x="400" y="267" fill="#087c74" font-family="Arial, sans-serif" font-size="18" font-weight="400">USB +5 V</text>
<text x="752" y="238" fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="700">Q1  BC327-40  (PNP)</text>
<line x1="740" y1="285" x2="800" y2="285" stroke="#087c74" stroke-width="3"/>
<line x1="800" y1="285" x2="822" y2="320" stroke="#087c74" stroke-width="3"/>
<line x1="858" y1="320" x2="880" y2="285" stroke="#087c74" stroke-width="3"/>
<line x1="880" y1="285" x2="940" y2="285" stroke="#087c74" stroke-width="3"/>
<line x1="795" y1="320" x2="885" y2="320" stroke="#087c74" stroke-width="4"/>
<line x1="840" y1="320" x2="840" y2="360" stroke="#087c74" stroke-width="3"/>
<polygon points="818.000,314.000 815.097,298.107 804.938,304.493" fill="#087c74"/>
<text x="744" y="271" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">E (3)</text>
<text x="898" y="271" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">C (1)</text>
<text x="858" y="352" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">B (2)</text>
<line x1="940" y1="285" x2="1310" y2="285" stroke="#087c74" stroke-width="3"/>
<text x="1060" y="259" fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="700">TARGET +5 V</text>
<text x="1100" y="321" fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="700">ZIF pin 33 / H4.1</text>
<text x="1080" y="349" fill="#667789" font-family="Arial, sans-serif" font-size="16" font-weight="400">Slightly below VBUS under load</text>
<line x1="840" y1="360" x2="840" y2="455" stroke="#087c74" stroke-width="2"/>
<line x1="600" y1="285" x2="600" y2="400" stroke="#087c74" stroke-width="2"/>
<line x1="600" y1="400" x2="690" y2="400" stroke="#087c74" stroke-width="2"/>
<rect x="690" y="388" width="80" height="24" fill="#ffffff" stroke="#087c74"/>
<line x1="770" y1="400" x2="840" y2="400" stroke="#087c74" stroke-width="2"/>
<text x="660" y="380" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700">R2  10k</text>
<rect x="828" y="455" width="24" height="60" fill="#ffffff" stroke="#087c74"/>
<text x="875" y="482" fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="700">R1  220 ohm</text>
<text x="875" y="510" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="400">1/4 W</text>
<line x1="840" y1="515" x2="840" y2="575" stroke="#087c74" stroke-width="2"/>
<line x1="840" y1="575" x2="840" y2="605" stroke="#1763a6" stroke-width="3"/>
<line x1="840" y1="605" x2="800" y2="635" stroke="#1763a6" stroke-width="3"/>
<line x1="800" y1="620" x2="800" y2="700" stroke="#1763a6" stroke-width="4"/>
<line x1="740" y1="665" x2="800" y2="665" stroke="#1763a6" stroke-width="3"/>
<line x1="800" y1="685" x2="840" y2="715" stroke="#1763a6" stroke-width="3"/>
<line x1="840" y1="715" x2="840" y2="730" stroke="#1763a6" stroke-width="3"/>
<polygon points="834.000,710.500 825.600,696.700 818.400,706.300" fill="#1763a6"/>
<text x="866" y="605" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">C (3)</text>
<text x="740" y="648" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">B (2)</text>
<text x="866" y="730" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">E (1)</text>
<text x="874" y="663" fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="700">Q2  2N3904</text>
<text x="874" y="691" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700">NPN</text>
<text x="95" y="613" fill="#17324d" font-family="Arial, sans-serif" font-size="22" font-weight="700">PICO 2 GP22</text>
<text x="95" y="642" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">Physical pin 29</text>
<line x1="95" y1="665" x2="400" y2="665" stroke="#1763a6" stroke-width="2"/>
<rect x="400" y="653" width="80" height="24" fill="#ffffff" stroke="#1763a6"/>
<text x="402" y="639" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="700">R3  1k</text>
<line x1="480" y1="665" x2="740" y2="665" stroke="#1763a6" stroke-width="2"/>
<line x1="590" y1="665" x2="590" y2="709" stroke="#1763a6" stroke-width="2"/>
<rect x="578" y="709" width="24" height="60" fill="#ffffff" stroke="#1763a6"/>
<text x="445" y="745" fill="#17324d" font-family="Arial, sans-serif" font-size="19" font-weight="700">R4  100k</text>
<line x1="590" y1="769" x2="590" y2="810" stroke="#1763a6" stroke-width="2"/>
<line x1="840" y1="730" x2="840" y2="810" stroke="#17324d" stroke-width="2"/>
<line x1="95" y1="810" x2="1310" y2="810" stroke="#17324d" stroke-width="3"/>
<text x="95" y="794" fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="700">Pico GND</text>
<text x="1080" y="794" fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="700">ZIF pin 12 / H2.2</text>
<text x="600" y="841" fill="#667789" font-family="Arial, sans-serif" font-size="18" font-weight="400">Common ground: same as page 1</text>
<rect x="1030" y="402" width="500" height="252" fill="#f4f8fc" stroke="#f4f8fc"/>
<text x="1050" y="433" fill="#17324d" font-family="Arial, sans-serif" font-size="21" font-weight="700">TRANSISTOR LEADS</text>
<text x="1050" y="466" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">Reference TO-92 pin numbers:</text>
<text x="1050" y="499" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">BC327-40:  1 = C,  2 = B,  3 = E</text>
<text x="1050" y="532" fill="#17324d" font-family="Arial, sans-serif" font-size="18" font-weight="400">2N3904:      1 = E,  2 = B,  3 = C</text>
<text x="1050" y="574" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="400">The drawings show electrical terminals,</text>
<text x="1050" y="600" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="400">not physical leg placement. Check your</text>
<text x="1050" y="626" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="400">manufacturer/package before inserting.</text>
<rect x="45" y="880" width="1510" height="94" fill="#edf6f1" stroke="#edf6f1"/>
<text x="65" y="909" fill="#17324d" font-family="Arial, sans-serif" font-size="20" font-weight="700">HOW IT WORKS</text>
<text x="65" y="936" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="400">GP22 drives Q2, which pulls Q1 base down through R1. Q1 then supplies the target. R2 and R4 default both transistors off.</text>
<text x="65" y="960" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="400">R1 gives about 18 mA base drive to Q1; R3 draws about 2.5 mA from the Pico. Initial design load: up to 150 mA target current.</text>
<text x="45" y="1005" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="700">Check the loaded voltage at ZIF pin 33 before relying on this switch: aim for at least 4.5 V with the target running.</text>
<text x="45" y="1033" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="400">Before GP22 LOW, release bus/SWD outputs and disable pulls. Start with a 1-second off delay; verify that the target resets.</text>
<text x="45" y="1061" fill="#17324d" font-family="Arial, sans-serif" font-size="17" font-weight="400">Pico USB must supply probe + target + base drive; request a 500 mA USB configuration before enabling target power.</text>
<text x="45" y="1094" fill="#667789" font-family="Arial, sans-serif" font-size="16" font-weight="400">Prototype switch: no current limiting or active discharge. No relay or flyback diode is needed. See README for connections.</text>
</svg>